<!doctype html>
<html><head><meta charset="utf-8"><title>studio</title>
<style>
  :root { --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  html, body { margin: 0; width: 1080px; height: 1440px; overflow: hidden; font-family: var(--font); color: #141414; }
  body { background: radial-gradient(120% 90% at 50% 0%, #FBFAF8 0%, #EFEEEA 55%, #E6E4DF 100%); }
  #cam { position: absolute; inset: 0; transform-origin: 0 0; transition: transform 1s cubic-bezier(.45, .05, .2, 1); will-change: transform; }
  /* the tablet: unbranded, thin even bezels, rounded corners, camera in the side bezel */
  #tab { position: absolute; left: 192px; top: 150px; width: 696px; height: 1062px; border-radius: 46px;
    background: linear-gradient(145deg, #2C2F33 0%, #17191C 60%, #0F1012 100%);
    box-shadow: 0 2px 0 1px #4A4E54 inset, 0 0 0 1.5px #08090A, 0 40px 80px -20px rgba(0,0,0,.45), 0 18px 30px -12px rgba(0,0,0,.35); }
  #tab::before { content: ''; position: absolute; right: 9px; top: 50%; width: 9px; height: 9px; margin-top: -4.5px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #3A4A66 0%, #0B0D12 60%); box-shadow: 0 0 0 1.5px #24272C; }
  #tab::after { content: ''; position: absolute; top: -4px; right: 120px; width: 120px; height: 5px; border-radius: 3px 3px 0 0; background: #2A2D31; box-shadow: -150px 0 0 #2A2D31; }
  #screen { position: absolute; left: 24px; top: 24px; width: 648px; height: 1014px; border-radius: 22px; overflow: hidden; background: #F3F3F1; }
  #scaler { position: absolute; left: 0; top: 0; width: 800px; height: 1252px; transform-origin: 0 0; }
  #status { position: absolute; left: 0; top: 0; width: 800px; height: 30px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px;
    box-sizing: border-box; font-size: 15px; font-weight: 600; color: #222; background: #FFFFFF; z-index: 2; }
  #status svg { width: 17px; height: 17px; }
  #app { position: absolute; left: 0; top: 30px; width: 800px; height: 1222px; border: 0; background: #F3F3F1; }
  #navpill { position: absolute; left: 50%; bottom: 7px; width: 120px; height: 5px; margin-left: -60px; border-radius: 3px; background: rgba(0,0,0,.32); z-index: 3; }
  /* the finger */
  #finger { position: absolute; left: 0; top: 0; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; z-index: 5; pointer-events: none;
    background: rgba(255, 255, 255, .42); box-shadow: 0 0 0 3px rgba(255,255,255,.98), 0 0 0 5px rgba(0,0,0,.38), 0 6px 16px rgba(0,0,0,.25);
    transition: left .6s cubic-bezier(.45,.05,.2,1), top .6s cubic-bezier(.45,.05,.2,1), opacity .3s, transform .12s; opacity: 0; }
  #finger.down { transform: scale(.8); background: rgba(255, 255, 255, .7); }
  .ripple { position: absolute; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; border: 3px solid rgba(255,255,255,.95); z-index: 4; pointer-events: none;
    animation: rip .6s ease-out forwards; box-shadow: 0 0 0 2px rgba(0,0,0,.15); }
  @keyframes rip { from { transform: scale(.6); opacity: .95; } to { transform: scale(2.1); opacity: 0; } }
  /* header */
  #head { position: absolute; left: 0; right: 0; top: 40px; text-align: center; }
  #head .kicker { font-size: 19px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: #8A8A86; display: flex; align-items: center; justify-content: center; gap: 10px; }
  #head .kicker img { width: 30px; height: 30px; }
  #head .t { margin-top: 8px; font-size: 38px; font-weight: 800; letter-spacing: -.01em; }
  /* the caption */
  #cap { position: absolute; left: 70px; right: 70px; bottom: 44px; min-height: 120px; display: flex; align-items: center; gap: 20px; padding: 22px 30px; box-sizing: border-box;
    background: rgba(255,255,255,.97); border-radius: 26px; box-shadow: 0 18px 50px -12px rgba(0,0,0,.28), 0 0 0 1px rgba(0,0,0,.05);
    transition: opacity .35s, transform .35s; z-index: 10; }
  #cap.hide { opacity: 0; transform: translateY(14px); }
  #cap .n { flex: none; display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; background: #141414; color: #fff; font-size: 24px; font-weight: 800; }
  #cap .txt { font-size: 33px; line-height: 1.24; font-weight: 650; }
  #cap .txt b { font-weight: 850; }
  #cap .txt .k { display: inline-block; padding: 0 10px; border-radius: 10px; background: #F1F1EE; font-weight: 800; }
  /* title and end cards */
  .card { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 90px;
    background: radial-gradient(120% 90% at 50% 0%, #FBFAF8 0%, #EFEEEA 55%, #E6E4DF 100%); z-index: 20; transition: opacity .7s; }
  .card.gone { opacity: 0; }
  .card, #cap, #head, #ring, #finger { pointer-events: none; }
  .card img { width: 128px; height: 128px; border-radius: 30px; box-shadow: 0 20px 40px -14px rgba(244,0,9,.45); }
  .card .k { margin-top: 34px; font-size: 22px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: #8A8A86; }
  .card h1 { margin: 14px 0 0; font-size: 76px; line-height: 1.05; font-weight: 850; letter-spacing: -.02em; }
  .card p { margin: 26px 0 0; font-size: 32px; line-height: 1.35; color: #444; max-width: 820px; }
  .card .pill { display: inline-flex; align-items: center; gap: 12px; margin-top: 40px; padding: 16px 26px; border-radius: 999px; background: #fff; font-size: 27px; font-weight: 700; box-shadow: 0 10px 30px -12px rgba(0,0,0,.25); }
  .card .av { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: #FFF5F5; color: #C8000A; font-weight: 850; font-size: 19px; }
  /* highlight ring around an element */
  #ring { position: absolute; z-index: 4; border-radius: 14px; box-shadow: 0 0 0 4px #FFC531, 0 0 0 9999px rgba(0,0,0,.0); pointer-events: none; opacity: 0; transition: opacity .3s, left .4s, top .4s, width .4s, height .4s; }
  #ring.on { opacity: 1; }
</style></head>
<body>
  <div id="cam">
    <div id="head"><div class="kicker"><img src="/icons/icon.svg" alt=""><span id="kick">Touch Map · Tutorial</span></div><div class="t" id="htitle"></div></div>
    <div id="tab"><div id="screen"><div id="scaler">
      <div id="status"><span id="clock">9:41</span><span style="display:flex;gap:8px;align-items:center">
        <svg viewBox="0 0 24 24" fill="#222"><path d="M12 20.5 1.5 8.4A15.6 15.6 0 0 1 12 4.5a15.6 15.6 0 0 1 10.5 3.9z"/></svg>
        <svg viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2"><rect x="2.5" y="7" width="17" height="10" rx="2.5"/><rect x="4.5" y="9" width="11" height="6" rx="1" fill="#222" stroke="none"/><path d="M21.5 10.5v3"/></svg>
        <span style="font-size:14px">84%</span></span></div>
      <iframe id="app" title="app"></iframe>
      <div id="ring"></div>
      <div id="finger"></div>
      <div id="navpill"></div>
    </div></div></div>
  </div>
  <div id="cap" class="hide"><span class="n" id="capn">1</span><span class="txt" id="capt"></span></div>
  <div class="card gone" id="intro" style="display:none"><img src="/icons/icon.svg" alt=""><div class="k" id="ik">Touch Map · Tutorial 1 of 6</div><h1 id="ih">Capture a touch</h1><p id="ip"></p></div>
  <div class="card gone" id="outro" style="display:none"><img src="/icons/icon.svg" alt=""><h1 id="oh">That’s it.</h1><p id="op"></p><div class="pill"><span class="av">AP</span> Your initials → Tutorials</div></div>
<script>
  // screen: 648 px wide for the app's 800 CSS px
  const S = 648 / 800;
  document.getElementById('scaler').style.transform = `scale(${S})`;
  const $ = (id) => document.getElementById(id);
  window.studio = {
    S,
    setIntro(kicker, title, sub) { $('ik').textContent = kicker; $('ih').textContent = title; $('ip').textContent = sub || ''; $('kick').textContent = kicker; $('htitle').textContent = title; },
    showIntro() { const i = $('intro'); i.style.display = 'flex'; i.classList.remove('gone'); },
    hideIntro() { $('intro').classList.add('gone'); setTimeout(() => { $('intro').style.display = 'none'; }, 800); },
    showOutro(title, sub, initials) { const o = $('outro'); $('oh').textContent = title; $('op').textContent = sub || ''; o.querySelector('.av').textContent = initials || 'AP'; o.style.display = 'flex'; requestAnimationFrame(() => requestAnimationFrame(() => o.classList.remove('gone'))); },
    cap(n, html) {
      const c = $('cap');
      if (!html) { c.classList.add('hide'); return; }
      c.classList.add('hide');
      setTimeout(() => { $('capn').textContent = n; $('capt').innerHTML = html; c.classList.remove('hide'); }, c.textContent.trim() && !c.classList.contains('hide') ? 260 : 0);
    },
    // finger, in the app's CSS pixels (the iframe's viewport), below the status bar
    fingerTo(x, y) { const f = $('finger'); f.style.left = x + 'px'; f.style.top = (y + 30) + 'px'; f.style.opacity = 1; },
    fingerHide() { $('finger').style.opacity = 0; },
    tapFx() { const f = $('finger'); f.classList.add('down'); setTimeout(() => f.classList.remove('down'), 160);
      const r = document.createElement('div'); r.className = 'ripple'; r.style.left = f.style.left; r.style.top = f.style.top; $('scaler').append(r); setTimeout(() => r.remove(), 700); },
    ring(rect) { const r = $('ring'); if (!rect) { r.classList.remove('on'); return; } const p = 6; Object.assign(r.style, { left: rect.x - p + 'px', top: rect.y + 30 - p + 'px', width: rect.width + 2 * p + 'px', height: rect.height + 2 * p + 'px' }); r.classList.add('on'); },
    // the camera: zoom on a rect of the app (CSS px), or back to the whole tablet
    zoom(rect, maxZ = 1.9) {
      const cam = $('cam');
      if (!rect) { window.studio.camNow = { z: 1, tx: 0, ty: 0 }; cam.style.transform = 'translate(0px, 0px) scale(1)'; return; }
      const sx = 216, sy = 174 + 30 * S; // screen origin on the canvas (tab + bezel), plus the status bar
      const cx = sx + (rect.x + rect.width / 2) * S, cy = sy + (rect.y + rect.height / 2) * S;
      const w = rect.width * S, h = rect.height * S;
      const z = Math.max(1, Math.min(maxZ, 980 / w, 1040 / h));
      let tx = 540 - z * cx, ty = 625 - z * cy;
      // keep the tablet filling the view: no empty floor under it, no gap at the sides
      const lo = 1255 - z * 1212, hi = -z * 150;
      if (lo <= hi) ty = Math.min(hi, Math.max(lo, ty)); else ty = Math.min(-z * 150 + 30, Math.max(1255 - z * 1212, ty));
      const lx = 1080 - z * 888, hx = -z * 192;
      if (lx <= hx) tx = Math.min(hx, Math.max(lx, tx)); else tx = 540 - z * 540;
      window.studio.camNow = { z, tx, ty };
      cam.style.transform = `translate(${tx}px, ${ty}px) scale(${z})`;
    },
    camNow: { z: 1, tx: 0, ty: 0 },
    // app CSS px → this page's px, through the camera
    toPage(x, y) { const c = window.studio.camNow; return { x: c.tx + c.z * (216 + x * S), y: c.ty + c.z * (174 + (y + 30) * S) }; },
  };
  setInterval(() => { const d = new Date(); $('clock').textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); }, 1000);
</script>
</body></html>
